name: Build and Publish FrankenPHP Images

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/laradoc-frankenphp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version: ['8.4', '8.2']

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-platform support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: image_name
        run: |
          echo "IMAGE_NAME_LOWER=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Determine Docker Tags
        id: tags
        run: |
          BASE="${{ steps.image_name.outputs.IMAGE_NAME_LOWER }}"
          PHP_VER="${{ matrix.php_version }}"
          if [ "$PHP_VER" = "8.4" ]; then
            echo "TAGS=${BASE}:${PHP_VER},${BASE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "TAGS=${BASE}:${PHP_VER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/frankenphp
          file: ./docker/frankenphp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.TAGS }}
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
