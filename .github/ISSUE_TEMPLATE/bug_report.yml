name: 🐛 Bug Report
description: Create a report to help us improve LaraDoc Starter
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please fill out the form below.

  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: What operating system, Docker, and PHP version are you using?
      placeholder: e.g. macOS Sequoia, Docker Desktop 4.38, PHP 8.4
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions on how to trigger the problem.
      placeholder: |
        1. Run 'bash setup.sh'
        2. Run 'bash add-project.sh my-app'
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Terminal Output
      description: Paste any terminal output, Docker logs, or screenshots.
      render: shell
