name: laradoc-starter

services:

  frankenphp:
    build:
      context: ./docker/frankenphp
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
    container_name: laravel_frankenphp
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./src:/var/www/html
      - ./docker/frankenphp/dashboard:/var/www/dashboard
      - ./docker/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./docker/frankenphp/conf.d:/etc/frankenphp/Caddyfile.d
      - caddy_data:/data
      - caddy_config:/config
      - composer_cache:/home/laravel/.composer
    environment:
      - APP_ENV=local
      - SERVER_NAME=:80
    networks:
      - laravel
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: laravel_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - laravel
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: laravel_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      UPLOAD_LIMIT: 50M
    networks:
      - laravel
    depends_on:
      mysql:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: laravel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - laravel
    profiles:
      - extras

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: laravel_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
    networks:
      - laravel
    profiles:
      - extras

  composer:
    image: composer:2.8
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - composer_cache:/tmp/composer
    environment:
      - COMPOSER_HOME=/tmp/composer
    entrypoint: ["composer"]
    networks:
      - laravel

  node:
    image: node:22-alpine
    container_name: laravel_node
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      - "5173-5183:5173-5183"
    environment:
      - VITE_HOST=0.0.0.0
    command: sh -c "[ -d node_modules ] || npm install && npm run dev"
    networks:
      - laravel
    profiles:
      - frontend

networks:
  laravel:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  composer_cache:
  node_modules:
  caddy_data:
  caddy_config:
